name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: APK derle
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk KitapMelegi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KitapMelegi
          path: KitapMelegi.apk
      - name: Sürüm yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kitap Meleği 1.0.${{ github.run_number }}
          body: Tablete kurmak için aşağıdaki KitapMelegi.apk dosyasını indir.
          files: KitapMelegi.apk
          make_latest: true
